version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
